[project]
name = "robot-vision-model-tools"
version = "0.1.0"
description = "ONNX inspection, validation, export, and manifest tools for RobotVisionPlatform"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "onnx>=1.16",
  "onnxruntime>=1.20"
]

[project.optional-dependencies]
export = ["ultralytics>=8.3"]

[tool.uv]
package = false
